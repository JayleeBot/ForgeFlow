[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeflow"
version = "0.1.0"
description = "Local-first quote operations assistant prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# Eval tooling is Promptfoo (Node CLI): `npx promptfoo@latest eval` / `view`.

[project.scripts]
forgeflow = "forgeflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
