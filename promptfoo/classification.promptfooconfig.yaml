description: ForgeFlow classification router agent

prompts:
  - "{{email_file}}"

providers:
  - id: file://classification.py
    label: classification-router
    config:
      pythonExecutable: /opt/homebrew/bin/python3.11

tests: file://classification.py:load_tests

defaultTest:
  assert:
    - type: python
      value: file://classification.py:check_classification
    - type: python
      value: file://classification.py:check_quote_signals
    - type: python
      value: file://classification.py:check_missing_fields
