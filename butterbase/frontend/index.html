<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeFlow — RFQ dashboard</title>
<style>
  :root {
    --bg: #17140f; --panel: #221d17; --line: #322a21; --ink: #f2ede6;
    --muted: #a2968a; --accent: #f5a524; --ok: #4ec9a5; --warn: #e0894a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.25rem 4rem; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin-bottom: .35rem; }
  h1 { font-size: 1.7rem; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: .9rem; }
  .bar { display: flex; gap: .6rem; align-items: center; margin: 1.25rem 0 1.75rem; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #1b1408; border: 0; border-radius: 7px;
    padding: .5rem .95rem; font-weight: 600; font-size: .88rem; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .stat { color: var(--muted); font-size: .85rem; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    padding: 1.1rem 1.25rem; margin-bottom: 1rem;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .meta { color: var(--muted); font-size: .82rem; margin-bottom: .9rem; }
  .tag {
    display: inline-block; padding: .13rem .5rem; border-radius: 999px;
    font-size: .72rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
    background: #2a231b; border: 1px solid var(--line); color: var(--muted);
  }
  .tag.quote { color: var(--ok); border-color: #2c4a41; }
  .tag.sent { color: var(--accent); border-color: #4a3a1c; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .84em; }
  .missing { color: var(--warn); }
  .empty, .error {
    border: 1px dashed var(--line); border-radius: 11px; padding: 2rem 1.5rem;
    text-align: center; color: var(--muted);
  }
  .error { border-color: #5a3630; color: #e6a08c; text-align: left; }
  .error code { display: block; margin-top: .6rem; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ForgeFlow</h1>
    <span class="sub">RFQ comparison table</span>
  </header>

  <div class="bar">
    <button id="refresh">Refresh</button>
    <span class="stat" id="stat">Loading…</span>
  </div>

  <div id="out"></div>
</div>

<script>
// Same app, different host: the API is on api.butterbase.ai while this page is
// served from the app subdomain, so this is a cross-origin fetch and depends on
// allowed_origins including this site.
const API = "https://api.butterbase.ai/v1/app_nkpie8ug8oun";
const out = document.getElementById("out");
const stat = document.getElementById("stat");
const btn = document.getElementById("refresh");

const esc = (v) =>
  String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// The agent nests its payload under `supplier_quote`; handle a flat shape too.
const coreOf = (extracted) => (extracted && extracted.supplier_quote) || extracted || {};

function priceRows(core) {
  const breaks = core.price_breaks;
  // Recorded as an array of {quantity, unit_price, lead_time, part_number, service_tier}.
  if (Array.isArray(breaks)) return breaks;
  // Tolerate a {tier: {qty: price}} map as well.
  if (breaks && typeof breaks === "object") {
    const rows = [];
    for (const [service_tier, qtys] of Object.entries(breaks)) {
      if (qtys && typeof qtys === "object") {
        for (const [quantity, unit_price] of Object.entries(qtys)) {
          rows.push({ service_tier, quantity, unit_price });
        }
      }
    }
    return rows;
  }
  return [];
}

function missingOf(core, quote) {
  const m = core.missing_fields ?? quote.missing_fields;
  if (Array.isArray(m)) return m;
  if (m && typeof m === "object") {
    // {per_part: [...], quote_level: [...]}
    return Object.values(m).flatMap((v) => (Array.isArray(v) ? v : []));
  }
  return [];
}

const CELL = (v) => (v === null || v === undefined || v === "" ? "—" : esc(v));

function quoteBlock(q) {
  const core = coreOf(q.extracted);
  const rows = priceRows(core);
  const missing = missingOf(core, q);
  // Everything the agent recorded that is not a price break or a nested blob.
  const scalars = Object.entries(core).filter(
    ([k, v]) => !["price_breaks", "missing_fields", "supplier_name"].includes(k)
      && v !== null && v !== "" && typeof v !== "object",
  );

  return `
    <div class="card" style="background:#1c1813">
      <h2>${esc(q.supplier_name || core.supplier_name || q.supplier_email || "Unknown supplier")}
        <span class="tag quote">${esc(q.status || "")}</span></h2>
      <div class="meta">${esc(q.supplier_email || "")}</div>
      ${rows.length ? `<div class="scroll"><table>
        <tr><th>Part</th><th>Tier</th><th>Qty</th><th>Unit price</th><th>Lead time</th></tr>
        ${rows.map((r) => `<tr>
          <td>${CELL(r.part_number)}</td><td>${CELL(r.service_tier)}</td>
          <td>${CELL(r.quantity)}</td><td><code>${CELL(r.unit_price)}</code></td>
          <td>${CELL(r.lead_time)}</td></tr>`).join("")}
      </table></div>` : `<div class="meta">No price breaks recorded yet.</div>`}
      ${scalars.length ? `<div class="scroll" style="margin-top:.7rem"><table>
        ${scalars.map(([k, v]) => `<tr><th style="width:38%">${esc(k)}</th>
          <td>${esc(v)}</td></tr>`).join("")}
      </table></div>` : ""}
      ${missing.length ? `<div class="meta missing" style="margin-top:.7rem">
        Outstanding: ${missing.map(esc).join(", ")}</div>` : ""}
    </div>`;
}

function render(rfqs) {
  if (!rfqs.length) {
    out.innerHTML = `<div class="empty">No RFQs recorded yet.<br>
      The agent writes here as it triages the inbox.</div>`;
    return;
  }
  out.innerHTML = rfqs.map((r) => {
    const quotes = r.supplier_quotes || [];
    return `<div class="card">
      <h2>${esc(r.subject || "(no subject)")}
        <span class="tag ${r.status === "supplier_quote" ? "quote" : "sent"}">${esc(r.status || "")}</span></h2>
      <div class="meta">${quotes.length} supplier${quotes.length === 1 ? "" : "s"}
        · updated ${esc((r.updated_at || "").replace("T", " ").slice(0, 16))}</div>
      ${quotes.length ? quotes.map(quoteBlock).join("")
        : `<div class="meta">No supplier has replied on this thread yet.</div>`}
    </div>`;
  }).join("");
}

// Baked in at deploy time by deploy-frontend.py, which holds the service key.
// The page therefore shows real data without a public endpoint or any credential
// in this bundle -- at the cost of being a snapshot rather than live.
const SNAPSHOT = window.__FORGEFLOW_SNAPSHOT__ || null;

function showSnapshot(note) {
  if (!SNAPSHOT) return false;
  render(SNAPSHOT.rfqs || []);
  const suppliers = (SNAPSHOT.rfqs || []).reduce((n, r) => n + (r.supplier_quotes || []).length, 0);
  stat.innerHTML = `${(SNAPSHOT.rfqs || []).length} RFQ · ${suppliers} quote${suppliers === 1 ? "" : "s"}
    · snapshot from ${esc((SNAPSHOT.captured_at || "").replace("T", " ").slice(0, 16))}
    ${note ? `<span class="missing">— ${esc(note)}</span>` : ""}`;
  return true;
}

async function load() {
  btn.disabled = true;
  stat.textContent = "Loading…";
  try {
    const res = await fetch(`${API}/fn/rfqs`, { headers: { accept: "application/json" } });
    if (res.status === 401) {
      // Expected until the read function is reachable from a browser. Fall back
      // to the deploy-time snapshot rather than showing the user nothing.
      if (showSnapshot("live read needs auth; redeploy to refresh")) return;
      stat.textContent = "";
      out.innerHTML = `<div class="error"><strong>The data function requires authentication.</strong>
        Its HTTP trigger is set to <code>auth: required</code>, so a browser with no end-user
        token cannot read it. Either set the trigger to <code>auth: none</code>, or put this
        page behind Butterbase auth and send the JWT with the request.</div>`;
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);
    const data = await res.json();
    const rfqs = data.rfqs || [];
    render(rfqs);
    const suppliers = rfqs.reduce((n, r) => n + (r.supplier_quotes || []).length, 0);
    stat.textContent = `${rfqs.length} RFQ${rfqs.length === 1 ? "" : "s"} · ${suppliers} quote${suppliers === 1 ? "" : "s"}`;
  } catch (err) {
    if (showSnapshot("live read failed; redeploy to refresh")) return;
    stat.textContent = "";
    out.innerHTML = `<div class="error"><strong>Could not load the comparison table.</strong>
      A failed cross-origin request usually means this site is not in the app's
      <code>allowed_origins</code>.<code>${esc(err.message)}</code></div>`;
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", load);
load();
</script>
</body>
</html>
