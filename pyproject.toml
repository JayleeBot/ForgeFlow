[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeflow"
version = "0.1.0"
description = "Local-first quote operations assistant prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
forgeflow = "forgeflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
